# =============================================================================
#  Jyssc — virtual host Apache
#  A deposer sur le serveur dans : /etc/apache2/sites-available/jyssc.conf
#  Puis :  a2ensite jyssc
#          apache2ctl configtest && systemctl reload apache2
#
#  NE PAS ajouter le bloc HTTPS a la main : certbot genere jyssc-le-ssl.conf.
#  Voir deploy/DEPLOIEMENT.md pour la procedure complete.
# =============================================================================

<VirtualHost *:80>
    ServerName  jyssc.fr
    ServerAlias www.jyssc.fr

    DocumentRoot /var/www/jyssc

    # --- Journaux dedies -----------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/jyssc.error.log
    CustomLog ${APACHE_LOG_DIR}/jyssc.access.log combined

    <Directory /var/www/jyssc>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Permet d'ecrire /mentions-legales au lieu de /mentions-legales.html
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME}.html -f
            RewriteRule ^(.*)$ $1.html [L]
        </IfModule>
    </Directory>

    # --- En-tetes de securite ------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # --- Compression ---------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/xml \
            application/javascript application/json image/svg+xml
    </IfModule>

    # --- Cache des fichiers statiques ---------------------------------------
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css                "access plus 30 days"
        ExpiresByType application/javascript  "access plus 30 days"
        ExpiresByType image/svg+xml           "access plus 30 days"
        ExpiresByType image/png               "access plus 30 days"
        ExpiresByType image/jpeg              "access plus 30 days"
    </IfModule>

    # --- Fichiers a ne jamais servir ----------------------------------------
    <DirectoryMatch "^/var/www/jyssc/(\.git|deploy)">
        Require all denied
    </DirectoryMatch>
</VirtualHost>
