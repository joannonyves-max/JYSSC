# =============================================================================
#  Jyssc — virtual host Nginx
#  A deposer sur le serveur dans : /etc/nginx/sites-available/jyssc
#  Puis :  ln -s /etc/nginx/sites-available/jyssc /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#
#  NE PAS ajouter le bloc HTTPS a la main : certbot le genere tout seul.
#  Voir deploy/DEPLOIEMENT.md pour la procedure complete.
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name jyssc.fr www.jyssc.fr;

    root /var/www/jyssc;
    index index.html;

    # --- Journaux dedies (n'interferent pas avec l'autre site) ---------------
    access_log /var/log/nginx/jyssc.access.log;
    error_log  /var/log/nginx/jyssc.error.log;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml;

    # --- En-tetes de securite ------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Pages du site -------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # --- Mise en cache des fichiers statiques --------------------------------
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- PHP : a DECOMMENTER quand le formulaire PHP sera en place -----------
    #     Verifiez d'abord la version du socket : ls /run/php/
    #
    # location ~ \.php$ {
    #     include snippets/fastcgi-php.conf;
    #     fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    # }

    # --- Fichiers a ne jamais servir ----------------------------------------
    location ~ /\.(git|env|htaccess) {
        deny all;
        return 404;
    }

    location = /deploy/ {
        deny all;
        return 404;
    }
}
